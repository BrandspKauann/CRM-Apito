<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#231e23">
  <title>Apito de Mestre | CRM</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/auth.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/pipeline.css">
  <link rel="stylesheet" href="/relationships.css">
  <link rel="stylesheet" href="/directory.css">
  <link rel="stylesheet" href="/segments.css">
  <script src="/relationships.js" defer></script>
  <script src="/kommo-import.js" defer></script>
  <script src="/segments.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main id="login-screen" class="login-screen" hidden>
    <div class="login-cover">
      <div class="brand"><img class="apito-logo" src="https://apitodemestre.com.br/wp-content/uploads/2025/04/logo-OficialApito.webp" width="48" height="48" alt=""><span class="wordmark">Apito <i>de</i> Mestre<span>CRM COMERCIAL</span></span></div>
      <div class="cover-caption"><h2>Relacionamentos<br>e negócios.</h2></div>
    </div>
    <section class="login-card" aria-labelledby="login-title">
      <p class="kicker">CRM comercial</p>
      <h1 id="login-title">Acesse sua conta</h1>
      <form id="login-form">
        <label>Usuário<input name="username" autocomplete="username" required></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" role="alert"></p>
        <button type="submit">Entrar no CRM</button>
      </form>
    </section>
  </main>
  <div class="frame" hidden>
    <a class="skip-link" href="#page-title">Ir para o conteúdo</a>
    <aside class="sidebar">
      <div class="brand"><img class="apito-logo" src="https://apitodemestre.com.br/wp-content/uploads/2025/04/logo-OficialApito.webp" width="48" height="48" alt=""><span class="wordmark">Apito <i>de</i> Mestre<span>CRM COMERCIAL</span></span></div>
      
      <nav aria-label="Menu principal"></nav>
    </aside>
    <div class="workspace-main">
      <header class="topbar">
        <div class="crumb"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9 5v14"/></svg><span>Workspace</span><span aria-hidden="true">/</span><b id="breadcrumb">Visão geral</b></div>
        <button id="logout" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5m-1-8h12m-4-4 4 4-4 4"/></svg>Sair</button>
      </header>
      <main class="page-body">
        <div class="heading"><div class="heading-copy"><p id="eyebrow" class="kicker"></p><h1 id="page-title" tabindex="-1">Visão geral</h1><p id="subtitle"></p></div><button type="button" id="create" hidden></button></div>
        <div id="alert" role="alert"></div>
        <div id="content"></div>
      </main>
    </div>
  </div>
  <dialog aria-labelledby="modalTitle"><form>
    <div class="dialog-head"><h2 id="modalTitle"></h2></div>
    <div id="fields"></div><p id="error" role="alert"></p>
    <div class="actions"><button type="button" id="cancel">Cancelar</button><button type="submit">Salvar</button></div>
  </form></dialog>
</body>
</html>
